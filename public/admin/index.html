<!doctype html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Admin — Garage Sale Córdoba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --kraft: #d9bd8c;
    --paper: #fbf4e4;
    --ink: #2e2013;
    --brown: #5a3a22;
    --red: #d64541;
    --green: #1e7d3a;
    --border: #d9c9a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: var(--ink);
    background: var(--kraft);
    min-height: 100vh;
  }
  header {
    background: var(--brown);
    color: var(--paper);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  header h1 { font-size: 1.15rem; margin: 0; }
  header .who { font-size: 0.85rem; opacity: 0.85; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    font-weight: 600;
  }
  .btn-primary {
    background: var(--brown);
    color: #fff;
    padding: 0.6rem 1.1rem;
  }
  .btn-danger {
    background: var(--red);
    color: #fff;
    padding: 0.5rem 0.9rem;
  }
  .btn-secondary {
    background: #ece0c6;
    color: var(--brown);
    padding: 0.5rem 0.9rem;
  }
  .btn-logout {
    background: transparent;
    color: var(--paper);
    border: 1px solid rgba(255,255,255,0.4);
    padding: 0.4rem 0.8rem;
    font-size: 0.85rem;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

  /* Login screen */
  #login-view {
    max-width: 420px;
    margin: 4rem auto;
    background: var(--paper);
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
  }
  #login-view h2 { margin-top: 0; }
  #login-view input {
    width: 100%;
    padding: 0.7rem 0.9rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 0.8rem;
  }
  #login-view .btn-primary { width: 100%; padding: 0.75rem; }
  .hint { font-size: 0.8rem; color: #7a6a52; margin-top: 1rem; }
  .msg { font-size: 0.9rem; margin-top: 1rem; padding: 0.6rem; border-radius: 6px; }
  .msg.ok { background: #d7f2dd; color: var(--green); }
  .msg.error { background: #fbdcdc; color: var(--red); }

  /* Dashboard */
  #dashboard-view { display: none; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
    gap: 0.6rem;
  }
  .item-row {
    background: var(--paper);
    border-radius: 10px;
    padding: 1.1rem;
    margin-bottom: 1rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 1rem;
  }
  .item-row .thumb-col { display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
  .item-row img.thumb, .item-row .thumb-placeholder {
    width: 120px; height: 90px; object-fit: cover; border-radius: 6px; background: #ece0c6;
    display: flex; align-items: center; justify-content: center; font-size: 2rem;
  }
  .item-row input[type=file] { font-size: 0.75rem; max-width: 130px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .fields label { display: block; font-size: 0.75rem; font-weight: 600; color: #7a6a52; margin-bottom: 0.2rem; }
  .fields input, .fields select, .fields textarea {
    width: 100%;
    padding: 0.45rem 0.6rem;
    border-radius: 5px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 0.9rem;
  }
  .fields .span-2 { grid-column: 1 / -1; }
  .row-actions { grid-column: 1 / -1; display: flex; gap: 0.6rem; align-items: center; justify-content: flex-end; }
  .row-status { font-size: 0.8rem; margin-right: auto; }
  .sold-checkbox { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; }
  #empty-admin { text-align: center; color: var(--brown); padding: 2rem; }

  @media (max-width: 560px) {
    .item-row { grid-template-columns: 1fr; }
    .fields { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>🔧 Garage Sale Córdoba — Admin</h1>
  <div>
    <span class="who" id="who-label"></span>
    <button class="btn-logout" id="logout-btn" style="display:none;">Cerrar sesión</button>
  </div>
</header>

<main>
  <section id="login-view">
    <h2>Ingresar</h2>
    <p style="font-size:0.9rem;color:#7a6a52;">Te enviamos un link mágico por email, sin contraseña.</p>
    <input type="email" id="email-input" placeholder="tu@email.com" autocomplete="email" required>
    <button class="btn-primary" id="send-link-btn">Enviarme el link mágico</button>
    <div id="login-msg"></div>
    <p class="hint">Solo las cuentas autorizadas por el dueño del sitio pueden editar artículos, aunque cualquier email puede pedir el link.</p>
  </section>

  <section id="dashboard-view">
    <div class="toolbar">
      <div id="dashboard-msg"></div>
      <button class="btn-primary" id="new-item-btn">+ Nuevo artículo</button>
    </div>
    <div id="items-list"></div>
    <p id="empty-admin" hidden>No hay artículos todavía. Creá el primero con "+ Nuevo artículo".</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script src="/admin/app.js"></script>
</body>
</html>
